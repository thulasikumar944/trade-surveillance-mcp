steps:

  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/trade-surveillance-images/trade-surveillance-mcp:$SHORT_SHA
      - .

  # Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/trade-surveillance-images/trade-surveillance-mcp:$SHORT_SHA

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - trade-surveillance-mcp
      - --image
      - asia-south1-docker.pkg.dev/$PROJECT_ID/trade-surveillance-images/trade-surveillance-mcp:$SHORT_SHA
      - --region
      - asia-south1
      - --service-account
      - mcp-runtime-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/trade-surveillance-images/trade-surveillance-mcp:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY